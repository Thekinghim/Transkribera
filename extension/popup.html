<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hämta föreläsning</title>
  <link rel="stylesheet" href="ui.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <img src="icons/icon48.png" alt="">
      <h1>Hämta föreläsning<small>Transkribera</small></h1>
    </div>
    <button class="btn small-btn" id="refresh" title="Sök igen">Sök igen</button>
  </header>

  <section class="card name-card">
    <label class="field" for="filename">Filnamn</label>
    <input type="text" id="filename" spellcheck="false" autocomplete="off">
  </section>

  <main id="list" aria-live="polite">
    <p class="muted center">Letar efter video…</p>
  </main>

  <footer>
    <a class="btn primary" id="openSite" href="https://thekinghim.github.io/Transkribera/" target="_blank" rel="noopener">Öppna Transkribera</a>
    <p class="muted small">Fungerar bara för video du redan kan spela upp. Kopieringsskyddat (DRM) eller krypterat innehåll kan inte sparas.</p>
  </footer>
  <script type="module" src="popup.js"></script>
</body>
</html>
